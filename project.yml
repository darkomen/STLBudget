name: STLBudget
options:
  bundleIdPrefix: es.stlbudget
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  STLBudget:
    type: application
    platform: macOS
    sources:
      - path: STLBudget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.stlbudget.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: minimal
